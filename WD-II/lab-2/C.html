<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LAB 2 C</title>
	<style type="text/css">
		table{
			text-align: center;
		}
	</style>

</head>
<body>
	<h1>Employee Registration</h1>

<form>
	<legend ><b>Personal Information</b></legend>
		<table>
		<tr>
			<td>Employee Id</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Employee Name">
			</td>

			<td>Employee Name</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Employee Name">
			</td>
		</tr>

		<tr>
			<td>Email</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Email">
			</td>

			<td>Contact No</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Contact No">
			</td>
		</tr>


		<tr>
			<td>Marital Status</td>
			<td>:</td>
			<td><input type="radio" name="gender"> single</td>
			<td><input type="radio" name="gender"> married</td>
			</td>
		</tr>
</table>

		<legend><b>Education Qualification</b></legend>
<table>
		<tr>
			<td>Education</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Education details">
			</td>

			<td>Experience</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Experience Details">
			</td>
		</tr>
</table>

		<legend><b>Job Details</b></legend>
<table>
		<tr>
			<td>Designation</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Education details">
			</td>

			<td>Job location</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Job Location">
			</td>
		</tr>

		<tr>
			<td>Salary</td>
			<td>:</td>
			<td><input type="text"placeholder="Enter Salary details">
			</td>
		</tr>
</table>
		<hr>

		<input type="submit" name="" value="Register">


		</table>
	
</form>
</body>
</html>
